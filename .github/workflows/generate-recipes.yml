name: Generate Recipe Pages

on:
  push:
    branches:
      - main
    paths:
      - "index.html"
      - "*.html"
      - "assets/**"
      - "sitemap.xml"
      - "robots.txt"
      - "recipes/*.json"
      - "templates/recipe-template.html"
      - "tools/**"
      - "requirements.txt"
      - ".github/workflows/**"
  pull_request:
    branches:
      - main
    paths:
      - "index.html"
      - "*.html"
      - "assets/**"
      - "sitemap.xml"
      - "robots.txt"
      - "recipes/*.json"
      - "templates/recipe-template.html"
      - "tools/**"
      - "requirements.txt"
      - ".github/workflows/**"
  workflow_dispatch:
    inputs:
      mode:
        description: "Choose a safe connection check or the full Bear automation"
        required: true
        default: google_connection_check
        type: choice
        options:
          - google_connection_check
          - full_automation

concurrency:
  group: bear-os-generator-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-google:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'google_connection_check'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: bear-sheets-automation@project-4ec5c25d-9c03-442e-ae2.iam.gserviceaccount.com

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Google Sheet client
        run: pip install gspread google-auth

      - name: Verify read-only Google Sheet access
        env:
          GOOGLE_SHEET_ID: 172x4320dVANkIUMbH0Aa4IGHXwzzKPguttD1oATDnUQ
        run: |
          python - <<'PY'
          import os
          import google.auth
          import gspread

          credentials, _ = google.auth.default(scopes=[
              "https://www.googleapis.com/auth/spreadsheets.readonly",
          ])
          client = gspread.authorize(credentials)
          spreadsheet = client.open_by_key(os.environ["GOOGLE_SHEET_ID"])
          worksheet = spreadsheet.worksheet("Daily Tracker")
          worksheet.acell("A1").value
          print(f"Google connection verified: {spreadsheet.title} / {worksheet.title}")
          PY

  generate:
    if: github.event_name != 'workflow_dispatch' || inputs.mode == 'full_automation'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run automation tests
        run: python -m pytest -q

      - name: Generate Bear OS content
        run: python tools/run_bear_os.py
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      - name: Debug generated files
        run: |
          echo "===== RECIPES FOLDER ====="
          ls -la recipes
          echo ""
          echo "===== HTML FILES ====="
          find recipes -name "*.html"
          echo ""
          echo "===== BEAR MEMORY ====="
          cat memory/bear_manifest.json
          echo ""
          echo "===== GIT STATUS ====="
          git status

      - name: Commit generated content
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi

          git commit -m "Bear OS generated content"
          git pull --no-rebase -X ours origin main
          git push origin main

  deploy:
    needs: generate
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout latest generated content
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  publish:
    needs: deploy
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout deployed content
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Authenticate to Google Cloud
        if: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER != '' }}
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: bear-sheets-automation@project-4ec5c25d-9c03-442e-ae2.iam.gserviceaccount.com

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Count verified publish queue
        run: echo "BEAR_PUBLISH_COUNT=$(find outputs/make_queue -type f -name \'*.json\' | wc -l)" >> "$GITHUB_ENV"

      - name: Publish ready Pinterest pins
        run: python tools/send_to_make.py
        env:
          MAKE_WEBHOOK_URL: ${{ secrets.MAKE_WEBHOOK_URL }}
          SITE_BASE_URL: https://40400meals.com

      - name: Update Google growth dashboard
        run: python tools/update_growth_dashboard.py --recipes "$BEAR_PUBLISH_COUNT" --pins "$BEAR_PUBLISH_COUNT"
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: 172x4320dVANkIUMbH0Aa4IGHXwzzKPguttD1oATDnUQ
          GOOGLE_SHEET_NAME: 40/400 Meals Accountability Dashboard
          GOOGLE_WORKSHEET_NAME: Daily Tracker

      - name: Commit Bear publishing state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add -A -- memory/bear_manifest.json outputs/make_queue

          if git diff --cached --quiet; then
            echo "No publishing-state changes to commit."
            exit 0
          fi

          git commit -m "Update Bear publishing state"
          git pull --no-rebase -X ours origin main
          git push origin main
